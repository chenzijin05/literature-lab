name: test

on:
  push:
  pull_request:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装依赖
        run: pip install -r requirements.txt
      - name: 运行测试
        run: |
          python tests/test_smoke.py
          python tests/test_parsing.py
          python tests/test_collect_mock.py
          python tests/test_digest_integration.py
