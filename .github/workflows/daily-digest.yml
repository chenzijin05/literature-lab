name: daily-digest

on:
  schedule:
    # UTC 00:00 = 北京时间 08:00
    - cron: '0 0 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装依赖
        run: pip install -r requirements.txt
      - name: 生成今日文献摘要
        run: python scripts/digest.py
      - name: 提交摘要与状态
        run: |
          git config user.name "literature-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add digest data/seen.json config/preferences.json
          git commit -m "chore: daily digest $(date -u +%F)" || echo "nothing to commit"
          git push || echo "push skipped (no permission or no change)"
